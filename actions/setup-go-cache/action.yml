name: setup-go-cache
description: Set up the Go toolchain with module and build caching
inputs:
  go-version:
    description: Explicit Go version; empty uses go.mod
    default: ""
  cache:
    description: Enable build/module cache
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: go.mod
        # Always resolve the newest patch release of the target minor so
        # govulncheck does not flag stdlib CVEs fixed in a later patch
        # (e.g. go1.25.0 -> go1.25.11 for GO-2026-5039/5037/4971/...).
        check-latest: true
        cache: ${{ inputs.cache }}
