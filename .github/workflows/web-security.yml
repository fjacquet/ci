name: web-security
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the app's package.json (for repos where the JS app is not at the repo root)
        type: string
        default: "."
      upload-sarif:
        description: Upload SARIF results to GitHub Code Scanning. Set to false for private repos without GHAS, where Code Scanning cannot be enabled; findings still fail the job instead.
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: web-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
          upload: ${{ inputs.upload-sarif && 'always' || 'never' }}
      - name: Fail on CodeQL findings (SARIF upload disabled)
        if: ${{ !inputs.upload-sarif }}
        run: |
          count=$(jq -s '[.[].runs[].results[]] | length' codeql-results/*.sarif)
          echo "CodeQL findings: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::CodeQL found $count result(s). Failing the job since SARIF upload to Code Scanning is disabled (upload-sarif=false)."
            exit 1
          fi
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      upload-sarif: ${{ inputs.upload-sarif }}
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: fjacquet/ci/actions/harden@v1 # nosemgrep: github-actions.security.third-party-action-not-pinned-to-commit-sha
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ inputs.working-directory }}
      - uses: fjacquet/ci/actions/sbom@v1 # nosemgrep: github-actions.security.third-party-action-not-pinned-to-commit-sha
        with:
          ecosystem: node
          working-directory: ${{ inputs.working-directory }}
