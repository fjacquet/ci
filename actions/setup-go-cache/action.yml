name: setup-go-cache
description: Set up the Go toolchain with module and build caching
inputs:
  go-version:
    description: Explicit Go version; empty uses the newest patch of the go.mod minor
    default: ""
  cache:
    description: Enable build/module cache
    default: "true"
runs:
  using: composite
  steps:
    # go.mod usually pins an exact patch ("go 1.27.1"). setup-go treats that
    # as an exact version even with check-latest, so govulncheck then flags
    # stdlib CVEs already fixed in a later patch. Turn the go directive into
    # a "~1.27.1" range: newest patch of that minor, never older than go.mod.
    - id: spec
      shell: bash
      env:
        EXPLICIT: ${{ inputs.go-version }}
      run: |
        if [ -n "$EXPLICIT" ]; then
          echo "version=$EXPLICIT" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        v=$(awk '$1 == "go" { print $2; exit }' go.mod)
        if [ -z "$v" ]; then
          echo "::error::no go directive in go.mod and no go-version input"
          exit 1
        fi
        case "$v" in *.*.*) ;; *) v="$v.0" ;; esac
        echo "version=~$v" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ steps.spec.outputs.version }}
        check-latest: true
        cache: ${{ inputs.cache }}
