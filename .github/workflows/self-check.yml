name: self-check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: zizmor
        run: uvx zizmor --format=github .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pinact check
        run: |
          go install github.com/suzuki-shunsuke/pinact/v4/cmd/pinact@v4.1.0
          # Exclude first-party fjacquet/* refs: they are intentionally ref-pinned to the
          # moving @v1 tag (per the zizmor unpinned-uses policy), not SHA-pinned.
          "$(go env GOPATH)/bin/pinact" run --check --exclude '^fjacquet/'
