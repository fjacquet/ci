name: go-ci
on:
  workflow_call:
    inputs:
      go-version: { type: string, default: "" }
    secrets:
      CODECOV_TOKEN: { required: false }
permissions:
  contents: read
concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: fjacquet/ci/actions/setup-go-cache@v1 # nosemgrep: github-actions.security.third-party-action-not-pinned-to-commit-sha
        with: { go-version: "${{ inputs.go-version }}" }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v8.2.0 — for uvx semgrep/codecov in make targets
      - run: make tools
      - run: make ci
      - run: make sbom
      - run: make coverage-upload
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
