name: npm-release
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      environment:
        description: Deployment environment gating the publish. Must exist in the caller repo.
        type: string
        default: "npm"
      working-directory:
        description: Directory containing the package.json to publish.
        type: string
        default: "."
      access:
        description: npm access level for the published package (public or restricted).
        type: string
        default: "public"
      create-github-release:
        description: Also create a GitHub Release for the tag that triggered the run.
        type: boolean
        default: true
      npm-version:
        description: npm CLI version to install. Trusted publishing requires >= 11.5.1.
        type: string
        default: "11.17.0"
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: write # gh release create
      id-token: write # OIDC for npm trusted publishing + provenance
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC, no NPM_TOKEN) needs npm >= 11.5.1. The npm bundled
      # with the Node runtime is not guaranteed to be recent enough, so pull it forward.
      # Pinned rather than @latest so a publish never runs on an unreviewed npm release.
      # zizmor's adhoc-packages rule cannot be satisfied here: npm is the package manager
      # itself, so it cannot come from the lockfile it is about to install.
      - name: Upgrade npm for trusted publishing
        env:
          NPM_VERSION: ${{ inputs.npm-version }}
        run: npm install -g "npm@${NPM_VERSION}" # zizmor: ignore[adhoc-packages]
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run test:run --if-present
      # Publishing a version that does not match the tag is silent and unrecoverable
      # (npm forbids re-publishing a version), so fail loudly before we reach the registry.
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v${pkg_version}" ]; then
            echo "::error::tag '${TAG}' does not match package.json version '${pkg_version}' (expected tag 'v${pkg_version}')"
            exit 1
          fi
          echo "publishing ${pkg_version} from tag ${TAG}"
      # No NPM_TOKEN: authentication comes from the OIDC id-token above. The trusted
      # publisher on npmjs.com must name the CALLER workflow file, not this one —
      # npm validates the calling workflow when workflow_call is involved.
      - name: Publish to npm
        env:
          ACCESS: ${{ inputs.access }}
        run: npm publish --provenance --access "$ACCESS"
      - name: Create GitHub release
        if: inputs.create-github-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --generate-notes --title "$TAG" \
            || gh release edit "$TAG" --draft=false
