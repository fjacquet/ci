name: go-ci
on:
  workflow_call:
    inputs:
      go-version: { type: string, default: "" }
    secrets:
      CODECOV_TOKEN: { required: false }
permissions:
  contents: read
concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: fjacquet/ci/actions/setup-go-cache@v1 # nosemgrep: github-actions.security.third-party-action-not-pinned-to-commit-sha
        with: { go-version: "${{ inputs.go-version }}" }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8.2.0 — for uvx semgrep/codecov in make targets
      - run: make tools
      - run: make ci
      - run: make sbom
      - run: make coverage-upload
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
