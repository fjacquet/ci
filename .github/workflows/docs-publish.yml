name: docs-publish
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: fjacquet/ci/actions/mkdocs-publish@v1 # nosemgrep: github-actions.security.third-party-action-not-pinned-to-commit-sha
        with:
          python-version: ${{ inputs.python-version }}
  deploy:
    needs: build
    # Only deploy to GitHub Pages from a branch push (e.g. main). On pull_request
    # the github-pages environment protection rejects the deploy, so the build job
    # still validates docs but we skip the doomed deploy attempt.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
