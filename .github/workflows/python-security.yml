name: python-security
on:
  workflow_call:
    inputs:
      python-version: { type: string, default: "3.12" }
      working-directory:
        description: Directory containing the Python project's Makefile/pyproject (for repos where it is not at the repo root)
        type: string
        default: "."
permissions:
  contents: read
concurrency:
  group: python-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: fjacquet/ci/actions/setup-uv@v1 # nosemgrep: github-actions.security.third-party-action-not-pinned-to-commit-sha
        with: { python-version: "${{ inputs.python-version }}" }
      - run: make install
      - run: make security
      # osv-scanner is a Go binary, not on PyPI: `uvx osv-scanner` never resolved, and `|| true` hid it.
      - name: Install osv-scanner
        working-directory: ${{ runner.temp }}
        env:
          OSV_VERSION: v2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -fsSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          install -m 0755 osv-scanner /usr/local/bin/osv-scanner
      - run: make vuln
